[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swingtrace"
version = "0.1.0"
description = "Open-source golf club detection and swing-path tracking from phone video (YOLO11)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0" }
authors = [{ name = "Nishanth Madthila" }]
keywords = ["golf", "computer-vision", "yolo", "object-tracking", "sports-analytics", "swing-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
  "ultralytics>=8.3",
  "opencv-python>=4.8",
  "numpy>=1.24",
  "scipy>=1.10",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
roboflow = ["inference>=0.20"]
dev = ["pytest"]

[project.scripts]
swingtrace = "swingtrace.cli:main"

[project.urls]
Homepage = "https://github.com/nishsm/swingtrace"
"Model" = "https://huggingface.co/nishsm/swingtrace"

[tool.setuptools.packages.find]
where = ["src"]
